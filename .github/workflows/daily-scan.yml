# Scans every user's tracked companies for new jobs each morning.
# Needs repository secrets ANTHROPIC_API_KEY, DATABASE_URL and (optionally)
# OWNER_EMAILS: Settings → Secrets and variables → Actions.
name: Daily job scan

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 8am New York (7am in winter)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scout.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
